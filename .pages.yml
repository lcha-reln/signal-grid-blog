media:
  - name: post_images
    label: 文章图片
    input: public/images/posts
    output: /signal-grid-blog/images/posts
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, series, seriesOrder, date, draft]
      primary: title
      sort: [series, seriesOrder, date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        description: 用于首页、搜索和分享卡片；留空时会自动提取正文。
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: updated
        label: 更新日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: tags
        label: 标签
        type: string
        list: true
      - name: series
        label: 学习路径
        type: select
        required: true
        options:
          values:
            - { name: aeron, label: Aeron 系统工程 }
            - { name: trading, label: 交易系统 }
            - { name: availability, label: 有状态系统可靠性 }
            - { name: performance, label: Java 低延迟工程 }
            - { name: meta, label: 站点指南 }
        description: 选择文章所属的顶层知识主线；具体组件与概念继续使用标签表示。
      - name: seriesOrder
        label: 路径排序
        type: number
        required: true
        options:
          min: 1
        description: 数值越小越靠前；页面会按顺序自动显示连续章节号。
      - name: permalink
        label: 文章地址
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 请使用小写英文、数字和连字符，例如 matching-engine-basics。
        description: 决定 /signal-grid-blog/posts/文章地址/，发布后尽量不要修改。
      - name: featured
        label: 首页精选
        type: boolean
        default: false
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: post_images
          rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"
